<!DOCTYPE html>
<html>
<head>
  <title>Distress Detection System</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #00796B;
    }
    .card {
      background-color: white;
      display: inline-block;
      width: 200px;
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px #ccc;
      font-size: 18px;
    }
    .label {
      font-weight: bold;
      margin-bottom: 10px;
    }
    #panic {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Distress Detection System</h1>

  <div class="card">
    <div class="label">Average BPM</div>
    <div id="avg-bpm">--</div>
  </div>
  <div class="card">
    <div class="label">Current BPM</div>
    <div id="curr-bpm">--</div>
  </div>
  <div class="card">
    <div class="label">GSR Value</div>
    <div id="gsr">--</div>
  </div>
  <div class="card">
    <div class="label">Panic Button</div>
    <div id="panic">Not Activated</div>
  </div>

  <script>
    // TODO: Replace this with your Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyAkADM8FLRg-fCQvTQ-fua5SpcLXGwJk5k",
      authDomain: "iotsemproject.firebaseapp.com",
      databaseURL: "https://iotsemproject-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "iotsemproject",
      storageBucket: "iotsemproject.appspot.com",
      messagingSenderId: "1008398490734",
      appId: "1:1008398490734:web:10212711157ae96d475a7f"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const sensorRef = database.ref("SensorData");

    sensorRef.on("value", (snapshot) => {
      const data = snapshot.val();
      document.getElementById("avg-bpm").textContent = data.Avg_BPM;
      document.getElementById("curr-bpm").textContent = data.BPM.toFixed(2);
      document.getElementById("gsr").textContent = data.GSR;
      document.getElementById("panic").textContent = data.Panic ? "Activated" : "Not Activated";
      document.getElementById("panic").style.color = data.Panic ? "red" : "black";
    });
  </script>
</body>
</html>
